<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>公開終了のお知らせ</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f6;
    --fg: #222;
    --muted: #666;
    --line: #d8d4cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181818;
      --fg: #e8e6e1;
      --muted: #9a9890;
      --line: #3a3a38;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    line-height: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    max-width: 32em;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    margin: 0 0 1.5rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--line);
  }
  p { margin: 0 0 0.5rem; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1>公開終了のお知らせ</h1>
  <p>このウェブサイトは公開を終了しました。</p>
  <p>これまでご覧いただき、ありがとうございました。</p>
</main>
</body>
</html>
